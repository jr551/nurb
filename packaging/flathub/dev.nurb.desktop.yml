# Flathub manifest for nurb (dev.nurb.desktop)
#
# The desktop shell is a Tauri 2 app that bundles a Python wheel plus a uv
# sidecar; on first launch it provisions a managed CPython, a venv from a
# hash-pinned lock, a Node LTS, and the agent adapters into its app-data
# directory. All of those writes stay under the XDG data home inside the
# sandbox, which is what makes this Flathub-compatible.
#
# Build locally with:
#   flatpak-builder --user --install --force-clean builddir packaging/flathub/dev.nurb.desktop.yml
#
# Before submission: point the git source at the upstream repository and pin
# an exact commit (Flathub rejects branch-tracking sources).

app-id: dev.nurb.desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-toolchain//24.08
command: nurb
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home

modules:

  # Node.js: build-time tooling for npm/vite/tauri (the runtime Node the app
  # provisions at first launch is its own, downloaded into app data).
  - name: nodejs
    buildsystem: simple
    sources:
      - type: archive
        url: https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz
        sha256: 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
        strip-components: 1
        dest: nodejs
    build-commands:
      - cp -a nodejs/. /app/

  # uv: build-time only (runs scripts/stage.sh to build the wheel and fetch
  # the runtime sidecar). Lives outside /app/bin so the bundled sidecar can
  # own /app/bin/uv at runtime.
  - name: uv
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/astral-sh/uv/releases/download/0.12.1/uv-x86_64-unknown-linux-gnu.tar.gz
        sha256: 90b2f223fb69d19db49e117da601f64978593417988530aa733d456141b4bcbb
        strip-components: 0
    build-commands:
      - install -Dm755 uv-x86_64-unknown-linux-gnu/uv /app/opt/uv/bin/uv

  - name: nurb-desktop
    buildsystem: simple
    build-options:
      prepend-path:
        - /usr/lib/sdk/rust-toolchain/bin
        - /app/opt/uv/bin
        - /app/bin
      env:
        # The build sandbox mounts /run/build on a tmpfs sized to half of
        # RAM; a cargo target dir does not fit on small builders, so it goes
        # to /app and is removed before the module finishes.
        CARGO_TARGET_DIR: /app/cargo-target
        CARGO_HOME: /app/cargo-home
        CARGO_NET_OFFLINE: 'false'
    sources:
      - type: git
        url: https://github.com/jr551/nurb.git
        branch: linux-port
        # commit: <pin before submission>
    build-commands:
      - cd desktop && npm ci --no-audit --no-fund
      # Builds the nurb wheel into src-tauri/resources, writes the hash-pinned
      # dependency lock, and downloads the uv sidecar for this platform.
      - cd desktop && npm run stage
      - cd desktop && npm run tauri build -- --bundles deb
      - install -Dm755 /app/cargo-target/release/nurb /app/bin/nurb
      # Tauri strips the target-triple suffix from externalBin sidecars.
      - install -Dm755 /app/cargo-target/release/uv /app/bin/uv
      - cp -r /app/cargo-target/release/resources /app/bin/resources
      - install -Dm644 packaging/flathub/dev.nurb.desktop.metainfo.xml /app/share/metainfo/dev.nurb.desktop.metainfo.xml
      - install -Dm644 desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.nurb.desktop.png
      - install -Dm644 desktop/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/dev.nurb.desktop.png
      - |
        printf '%s\n' \
          '[Desktop Entry]' \
          'Type=Application' \
          'Name=nurb' \
          'Exec=nurb' \
          'Icon=dev.nurb.desktop' \
          'Terminal=false' \
          'Categories=Graphics;Engineering;' \
          > /app/share/applications/dev.nurb.desktop
      - rm -rf /app/cargo-target /app/cargo-home
